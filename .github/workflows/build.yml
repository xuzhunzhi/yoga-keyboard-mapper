name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/YogaKeyboardMapper/YogaKeyboardMapper.csproj -p:Platform=x64

      - name: Build
        run: dotnet build src/YogaKeyboardMapper/YogaKeyboardMapper.csproj -c Release -p:Platform=x64 --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoga-keyboard-mapper-x64
          path: src/YogaKeyboardMapper/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
